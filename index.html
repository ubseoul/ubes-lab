<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Experiments</title>
<style>
:root{--ink:#37352f;--mute:#9b9a97;--line:rgba(55,53,47,.09);--hover:#f1f1ef;--callout:#f7f6f3;box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;padding-top:env(safe-area-inset-top,0);-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:56px 22px 120px}
.icon{font-size:64px;line-height:1;margin-bottom:12px}
h1{font-size:38px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0 0 20px}
h2{font-size:22px;font-weight:600;margin:32px 0 6px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:500;color:var(--mute);margin:24px 0 4px}
p{margin:4px 0 8px}ul{margin:4px 0 8px;padding-left:22px}li{margin:3px 0}
.callout{display:flex;gap:12px;background:var(--callout);border-radius:4px;padding:16px;margin:8px 0 24px}
.callout .e{font-size:22px;line-height:1.3}.callout p{margin:0 0 6px}.callout .m{color:var(--mute);font-size:15px;margin:0}
.todo{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.todo i{flex:none;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;margin-top:5px}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;margin:0 -8px;border-radius:4px;text-decoration:none;color:inherit}
.row:hover,.row:active{background:var(--hover)}
.row .t{font-weight:500}.row .s{color:var(--mute);font-size:14px;display:block}
.tag{display:inline-block;font-size:13px;line-height:1.4;padding:0 7px;border-radius:3px;background:#e3e2e0;margin-left:6px;font-weight:400}
.t-planned{background:#e3e2e0}.t-running{background:#d3e5ef}.t-done{background:#dbeddb}.t-worked{background:#dbeddb}.t-refine{background:#fdecc8}.t-invalidated{background:#ffe2dd}.t-failed{background:#ffe2dd}.t-inconclusive{background:#e8deee}
.prop{display:flex;gap:16px;font-size:14px;padding:4px 0}.prop span:first-child{width:80px;color:var(--mute)}
.short{border-left:3px solid var(--ink);padding:2px 0 2px 14px;margin:10px 0}.short span{color:var(--mute);font-size:14px}
.cols{display:grid;gap:0 28px;grid-template-columns:1fr 1fr}@media(max-width:480px){.cols{grid-template-columns:1fr}}
.back{font-size:14px;color:var(--mute);text-decoration:none;display:inline-block;margin-bottom:28px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav a{flex:1;text-align:center;padding:14px 4px;font-size:14px;text-decoration:none;color:var(--mute)}nav a.on{color:var(--ink);font-weight:600}
a:focus-visible{outline:2px solid #2383e2;outline-offset:2px}
.m{color:var(--mute);font-size:15px}.ph{width:100%;border-radius:4px;border:1px solid var(--line);margin:8px 0}
.category-jumps{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 32px}.category-jumps button{font:inherit;font-size:14px;color:var(--ink);background:var(--callout);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;text-align:left}.category-jumps button:hover{background:var(--hover)}
button:focus-visible,summary:focus-visible{outline:2px solid #2383e2;outline-offset:3px}.learning-category{scroll-margin-top:24px;margin:36px 0}.learning-category h2{margin-bottom:16px}.learning-count{font-size:14px;font-weight:400;color:var(--mute);margin-left:8px}.learning-note{border-top:1px solid var(--line);padding:16px 0;overflow-wrap:anywhere}.learning-note p{white-space:pre-line}.learning-note.avoid{border-left:3px solid #b94b45;padding-left:12px}.learning-meta{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:14px}.learning-meta a{color:#57534b;text-underline-offset:3px}.learning-kind{color:#6c675e;font-size:14px}.learning-kind.avoid{color:#9d302b}.learning-category details{margin-top:12px;background:var(--callout);border-radius:6px;padding:12px 16px}.learning-category summary{cursor:pointer;font-size:15px;font-weight:500}.learning-category details .learning-note:first-of-type{margin-top:12px}.learning-category details .learning-note:last-child{padding-bottom:0}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
let G={},E=[],C=[];
const TABS=[["plan","Plan"],["experiments","Experiments"],["learnings","Learnings"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ul=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
const L={planned:"Planned",running:"Running",done:"Done",refine:"Refine and rerun",invalidated:"Results invalid",worked:"Worked",failed:"Failed",inconclusive:"Inconclusive"};
const tag=s=>`<span class="tag t-${esc(s)}">${esc(L[s]||s)}</span>`;
async function load(){
 try{const d=await (await fetch("data/experiments.json?"+Date.now())).json();G=d.goal||{};E=d.experiments||[];C=d.checklist||[];}
 catch(e){app.innerHTML="<p>Could not load data/experiments.json.</p>";return}
 route();}
function route(){
 let h=decodeURIComponent(location.hash.slice(1))||"plan";
 if(h==="checklist"){h="learnings";history.replaceState(null,"","#learnings")}
 const e=E.find(x=>x.id===h);const tab=h==="learnings"?"learnings":h==="experiments"||e?"experiments":"plan";
 nav.innerHTML=TABS.map(([k,n])=>`<a href="#${k}" class="${k===tab?"on":""}">${n}</a>`).join("");
 app.innerHTML=e?sheet(e):tab==="plan"?plan():tab==="learnings"?learnings():experiments();scrollTo(0,0);}
function sec(t,c){return c&&(!Array.isArray(c)||c.length)?`<h2>${t}</h2>${Array.isArray(c)?ul(c):`<p>${esc(c)}</p>`}`:""}
function plan(){
 return `<div class="icon">🎯</div><h1>${esc(G.mission)}</h1>
 <h2>Success criteria</h2>${(G.success||[]).map(s=>`<div class="todo"><i></i><span>${esc(s)}</span></div>`).join("")}`;}
const LEARNING_CATEGORIES=[
 ["hooks","Hooks & first frame"],
 ["context","Titles, text & context"],
 ["pacing","Pacing, length & loops"],
 ["editing","Editing, sound & visuals"],
 ["personality","Personality & community"],
 ["audience","Content & audience"],
 ["results","Results & measurement"],
 ["process","Experiment process"],
 ["direction","Research & direction"]
];
function learningCategory(text,kind){
 const t=text.toLowerCase();
 if(kind==="Success target"||kind==="Recorded metric")return "results";
 if(/different (account|platform)|switch accounts|invalidat|control variables|same effects|game constant|notes and research|research done|notes and research made|refine and rerun|results can't be trusted/.test(t))return "process";
 if(/title|caption|text|readable|read at|words|grade level/.test(t))return "context";
 if(/blur|zoom|sound|editing|memes|meme|ai (usage|thumbnail)|high note/.test(t))return "editing";
 if(/build.up|before the climax|close to.{0,8}climax|near.{0,8}climax|loop|seconds|length|avg time/.test(t))return /first (frame|scene|0|second)|0\.2|0\.5/.test(t)?"hooks":"pacing";
 if(/first.frame|first.scene|attention|eye.grabbing|hook|comprehens|incomprehens|digestible|clear|context|understand|explains the clip|emotionally dense/.test(t))return "hooks";
 if(/personality|community|fans|more me|friends|being him|100%|main subject|investment and presence|cursing|streamer/.test(t))return "personality";
 if(/performance|engagement|views|swipe|results|did best|best engagement|last place|second best|hours|ratio|gained/.test(t))return "results";
 if(/content|audience|kids|roblox|game|premise|skit|challenge|competitor|opponent|longform|long form|shortform|scary|script writer/.test(t))return "audience";
 return "direction";
}
function learningEntries(){
 const items=new Map();
 const add=(text,source,kind,testing=false)=>{
  if(typeof text!=="string"||!text.trim())return;
  const key=(testing?"test:":"note:")+text.trim().toLowerCase().replace(/\s+/g," ");
  if(!items.has(key))items.set(key,{text,category:learningCategory(text,kind),testing,sources:[]});
  const item=items.get(key);
  if(!item.sources.some(s=>s.id===source&&s.kind===kind))item.sources.push({id:source,kind});
 };
 for(const c of C)add(c.text,c.source,c.type==="must"?"Your rule":"Helpful practice");
 for(const e of E){
  const research=e.id.startsWith("research-");
  const reflection=e.id.startsWith("reflections-");
  for(const text of e.results||[])add(text,e.id,"Recorded result");
  for(const text of e.insights?.do||[])add(text,e.id,"Do");
  for(const text of e.insights?.avoid||[])add(text,e.id,"Avoid");
  if(e.conclusion)add(e.conclusion,e.id,"Conclusion");
  for(const text of e.notes||[]){
   if(/^(Post \d+:|The (three|six) post concepts|Unlabeled|Diagram:|Relationship to|Crossed-out|Side list, context unclear:)/i.test(text))continue;
   if(/^Success:/i.test(text)){add(text,e.id,"Success target",true);continue}
   if(/^Experiment idea:|next experiment/i.test(text)){add(text,e.id,"Idea to test",true);continue}
   if(/^Pre-Notes & Thoughts:.*constant/i.test(text)){add(text,e.id,"Method",true);continue}
   add(text,e.id,research?"Research observation":reflection?"Reflection":"Note");
  }
  for(const s of e.shorts||[]){
   const values=[["views",s.views],["engagement",s.engagement],["swipe-away",s.swipe_away]].filter(([,v])=>v!==undefined&&v!=="");
   if(values.length)add(`Short ${s.n}: ${values.map(([name,v])=>`${v} ${name}`).join(" · ")}`,e.id,"Recorded metric");
  }
  add(e.hypothesis,e.id,"Hypothesis",true);
  for(const text of e.method||[])add(text,e.id,"Method",true);
  for(const text of e.next_steps||[])add(text,e.id,"Next step",true);
 }
 return [...items.values()];
}
function learningNote(item){
 const avoid=item.sources.some(s=>s.kind==="Avoid");
 const kinds=[...new Set(item.sources.map(s=>s.kind))];
 const sources=[...new Set(item.sources.map(s=>s.id))];
 return `<article class="learning-note${avoid?" avoid":""}"><p>${esc(item.text)}</p><div class="learning-meta"><span class="learning-kind${avoid?" avoid":""}">${kinds.map(esc).join(" · ")}</span>${sources.map(id=>`<a href="#${encodeURIComponent(id||"")}">${esc(E.find(e=>e.id===id)?.title||"Source notes")}</a>`).join("")}</div></article>`;
}
function learnings(){
 const items=learningEntries();
 const categories=LEARNING_CATEGORIES.map(([id,title])=>({id,title,items:items.filter(x=>x.category===id)})).filter(c=>c.items.length);
 return `<div class="icon">💡</div><h1>Learnings</h1><p class="m">Your findings, research observations, and rules, organized by category. Every note links to its source. Hypotheses, methods, and next steps are listed separately as ideas to test.</p>
 ${categories.length?`<div class="category-jumps" aria-label="Learning categories">${categories.map(c=>`<button type="button" onclick="document.getElementById('learning-${c.id}').scrollIntoView({behavior:'smooth'})">${esc(c.title)}</button>`).join("")}</div>`:"<p>No learnings recorded yet.</p>"}
 ${categories.map(c=>{const notes=c.items.filter(x=>!x.testing),tests=c.items.filter(x=>x.testing);return `<section class="learning-category" id="learning-${c.id}" aria-labelledby="heading-${c.id}"><h2 id="heading-${c.id}">${esc(c.title)}<span class="learning-count">${c.items.length}</span></h2>${notes.map(learningNote).join("")}${tests.length?`<details><summary>Ideas & methods to test (${tests.length})</summary>${tests.map(learningNote).join("")}</details>`:""}</section>`}).join("")}`;
}
function experiments(){return `<div class="icon">🧪</div><h1>Experiments</h1><hr>${E.map(e=>`<a class="row" href="#${encodeURIComponent(e.id)}"><span>📄</span><span><span class="t">${esc(e.title)}</span>${tag(e.status)}<span class="s">${esc(e.summary||"")}</span></span></a>`).join("")}`;}
function sheet(e){const i=e.insights;
 return `<a class="back" href="#experiments">← Experiments</a><div class="icon">📄</div><h1>${esc(e.title)}</h1>
 <div class="prop"><span>Status</span><span>${tag(e.status).replace(' class="tag',' style="margin:0" class="tag')}</span></div>${e.date?`<div class="prop"><span>Date</span><span>${esc(e.date)}</span></div>`:""}<hr>
 ${sec("Hypothesis",e.hypothesis)}${sec("Method",e.method)}
 ${e.shorts?.length?`<h2>Posts</h2>${e.shorts.map(s=>`<div class="short"><span>Short ${s.n}${s.views?" · "+esc(s.views)+" views":""}${s.engagement?" · "+esc(s.engagement)+" engagement":""}${s.swipe_away?" · "+esc(s.swipe_away)+" swipe-away":""}</span><br>${esc(s.concept)}</div>`).join("")}`:""}
 ${sec("Results",e.results)}${i?`<div class="cols"><div>${sec("Do",i.do)}</div><div>${sec("Avoid",i.avoid)}</div></div>`:""}
 ${sec("Notes",e.notes)}${sec("Conclusion",e.conclusion)}${sec("Next steps",e.next_steps)}${(e.photos||[]).length?`<h2>Original notes</h2>${e.photos.map(p=>`<a href="${esc(p.file)}" target="_blank"><img class="ph" src="${esc(p.file)}" alt="${esc(p.caption||e.title)}" loading="lazy"></a>`).join("")}`:""}`;}
addEventListener("hashchange",route);load();
</script></body></html>
